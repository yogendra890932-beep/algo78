<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#0a0e14"/>
<title>{% block title %}Optiscalper{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg"/>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png"/>
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png"/>
<link rel="manifest" href="/static/site.webmanifest"/>
<link rel="stylesheet" href="/static/css/style.css?v=20261009-1"/>
{% block extra_head %}{% endblock %}
</head>
<body>
{% if show_nav != false %}
<nav class="navbar">
  <div class="nav-brand"><img class="nav-logo" src="/static/logo.png" alt="Optiscalper"/>Optiscalper</div>
  <div class="nav-links">
    <a href="/dashboard"  id="nav-dashboard">Dashboard</a>
    <a href="/trades"     id="nav-trades">Trades</a>
    <a href="/terminal"   id="nav-terminal">Terminal</a>
    <a href="/billing"    id="nav-billing">Billing</a>
    <a href="/settings"   id="nav-settings">Settings</a>
    <span id="nav-admin-wrap" style="display:none">
      <a href="/admin" id="nav-admin">Admin</a>
      <a href="/admin/billing" id="nav-admin-billing">Billing Admin</a>
      <a href="/admin/rewards" id="nav-admin-rewards">Rewards Admin</a>
      <a href="/admin/rewards/settings" id="nav-admin-rewards-settings">Campaign Settings</a>
    </span>
    <button onclick="logout()" class="btn-logout">Logout</button>
  </div>
</nav>
{% endif %}

<main class="main-content">
  {% block content %}{% endblock %}
</main>

<script>
const API = '';

function getToken()  { return localStorage.getItem('access_token'); }

// Decodes the user_id (JWT "sub" claim) directly from the access
// token — does NOT depend on syncUserInfo() having completed yet.
// This avoids a race where a page's own DOMContentLoaded handler
// (e.g. dashboard's connectWS()) runs before base.html's async
// syncUserInfo() fetch resolves, which previously left
// localStorage.user_id unset and silently broke the WebSocket
// connection (and therefore live feed / voice alerts / push) on
// fast page loads.
function getUserId() {
  const cached = localStorage.getItem('user_id');
  if (cached) return cached;
  const token = getToken();
  if (!token) return null;
  try {
    const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    return payload.sub || null;
  } catch (e) {
    return null;
  }
}
function getRole()   { return localStorage.getItem('role'); }

// ── Sliding session (48h idle timeout) ──────────────────────────
// Access tokens are short lived, so the page keeps itself signed in by
// silently rotating them with the stored refresh token. The server only
// rejects the refresh once the session has been idle for 48 hours, so an
// active user is never logged out and a user returning after 48h has to
// sign in again.

function jwtPayload(token) {
  try {
    const b = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(atob(b + '==='.slice((b.length + 3) % 4)));
  } catch (e) { return null; }
}

function tokenExpired() {
  const t = getToken();
  if (!t) return true;
  const p = jwtPayload(t);
  return !p || !p.exp || p.exp * 1000 < Date.now();
}

let _refreshPromise = null;

async function refreshSession() {
  const rt = localStorage.getItem('refresh_token');
  if (!rt) return false;
  if (_refreshPromise) return _refreshPromise;
  _refreshPromise = (async () => {
    try {
      const r = await fetch(API + '/api/auth/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: rt })
      });
      if (!r.ok) return false;
      const d = await r.json();
      if (!d || !d.access_token) return false;
      localStorage.setItem('access_token', d.access_token);
      if (d.refresh_token) localStorage.setItem('refresh_token', d.refresh_token);
      return true;
    } catch (e) {
      return false;
    } finally {
      _refreshPromise = null;
    }
  })();
  return _refreshPromise;
}

let _refreshTimer = null;
function scheduleTokenRefresh() {
  if (_refreshTimer) clearTimeout(_refreshTimer);
  const t = getToken();
  const p = t ? jwtPayload(t) : null;
  let ms = p && p.exp ? p.exp * 1000 - Date.now() - 60000 : 30 * 60 * 1000;
  ms = Math.max(60000, Math.min(ms, 12 * 60 * 60 * 1000));
  _refreshTimer = setTimeout(async () => {
    await refreshSession();
    scheduleTokenRefresh();
  }, ms);
}

async function apiFetch(url, options = {}) {
  const doFetch = () => {
    const token = getToken();
    return fetch(API + url, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': 'Bearer ' + token } : {}),
        ...(options.headers || {})
      }
    });
  };
  try {
    let resp = await doFetch();
    if (resp.status === 401) {
      // Expired access token — rotate it and retry once before giving up.
      if (!options._retried && await refreshSession()) {
        resp = await doFetch();
      }
      if (resp.status === 401) { logout(); return null; }
    }
    return resp;
  } catch (e) {
    console.error('API error:', e);
    return null;
  }
}

function logout() {
  const token = getToken();
  try {
    if (token) {
      fetch(API + '/api/auth/logout', {
        method: 'POST', keepalive: true,
        headers: { 'Authorization': 'Bearer ' + token }
      });
    }
  } catch (e) { }
  localStorage.clear();
  window.location.href = '/login';
}

// Highlight active nav link
function setActiveNav() {
  const path = window.location.pathname;
  document.querySelectorAll('.nav-links a').forEach(a => {
    a.classList.toggle('active', a.getAttribute('href') === path);
  });
}

// Fetches the current user's role/id from the server and caches them
// in localStorage (role/user_id are NOT returned by /login or
// /register — only access_token/refresh_token are). Used to show/hide
// the Admin nav link without re-fetching on every page.
async function syncUserInfo() {
  try {
    const r = await apiFetch('/api/auth/me');
    if (!r || !r.ok) return null;
    const user = await r.json();
    localStorage.setItem('role',    user.role);
    localStorage.setItem('user_id', user.id);
    localStorage.setItem('email',   user.email);
    return user;
  } catch (e) {
    return null;
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  const token = getToken();
  const path  = window.location.pathname;

  // Pages that don't require authentication — never redirect from these,
  // never call syncUserInfo() (which would trigger a 401 → logout() →
  // redirect back to /login → infinite loop if token is expired/missing).
  const publicPaths = ['/', '/login', '/reset-password', '/about', '/terms', '/privacy', '/refund'];
  if (publicPaths.includes(path)) {
    setActiveNav();
    return;
  }

  // Protected page — require a token
  if (!token) {
    window.location.href = '/login';
    return;
  }

  // Keep an active session alive: rotate the access token before it
  // expires (and immediately if this tab was left open past expiry).
  // refreshSession() fails only when the session has been idle > 48h.
  if (tokenExpired()) {
    const ok = await refreshSession();
    if (!ok) { logout(); return; }
  }
  scheduleTokenRefresh();

  // Fetch real role from server (cheap, needed for Admin nav link).
  // apiFetch returns null on 401 and calls logout() — that's safe here
  // because we're on a protected page where logout/redirect is correct.
  const user = await syncUserInfo();
  if (user && user.role === 'admin') {
    const aw = document.getElementById('nav-admin-wrap');
    if (aw) aw.style.display = 'inline';
  }
  setActiveNav();
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
